<!doctype html><meta charset="utf-8"><title>LADDU Test Harness</title><style>body{font:20px sans-serif;margin:30px}button,input{font-size:20px;margin:8px;padding:10px}.scroll{height:140px;overflow:auto;border:2px solid #333;padding:20px}</style><h1>LADDU TEST HARNESS</h1><button id="click">CLICK_ME</button><button id="double">DOUBLE_CLICK_ME</button><button id="right">RIGHT_CLICK_ME</button><div id="scroll" class="scroll">SCROLL_AREA<br><br>Scroll here<br><br>End</div><input id="text" aria-label="TEXT_INPUT" placeholder="TEXT_INPUT"><div id="hotkey" tabindex="0">HOTKEY_AREA (CTRL+SHIFT+A)</div><script>const state={clicked:false,doubleClicked:false,rightClicked:false,scrollDelta:0,text:'',hotkey:''};const save=()=>window.harness.state(state);click.onclick=()=>{state.clicked=true;save()};double.ondblclick=()=>{state.doubleClicked=true;save()};right.oncontextmenu=e=>{e.preventDefault();state.rightClicked=true;save();return false};scroll.onscroll=()=>{state.scrollDelta=scroll.scrollTop;save()};text.oninput=()=>{state.text=text.value;save()};addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='a'){state.hotkey='CTRL+SHIFT+A';save()}});</script>

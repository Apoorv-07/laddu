<!doctype html><html><head><meta charset="UTF-8"><title>LADDU</title><link rel="stylesheet" href="styles.css"></head><body>
<main id="app">
  <section class="orb-wrap" aria-label="LADDU companion"><div id="orb" class="orb idle"><div class="halo"></div><div class="face"><div class="brow left"></div><div class="brow right"></div><div class="eye left"><i></i></div><div class="eye right"><i></i></div><div class="mouth"></div></div><div class="state-dot"></div></div></section>
  <section class="panel"><div class="brand"><b>LADDU</b><span id="status">starting…</span></div><div id="capabilities" class="caps"></div><div id="messages" class="messages"><div class="msg laddu">Namaste — I’m here. Ask me something.</div></div><form id="chat"><input id="input" autocomplete="off" placeholder="Try: open Notepad / mera project check kar…"><button>Send</button></form><div class="hint">Click the orb to focus · real actions are verified or reported as unavailable</div></section>
</main><script src="app.js"></script></body></html>
